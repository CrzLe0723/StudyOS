name: Documentation improvement
description: Report unclear documentation or suggest a documentation change.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: textarea
    id: location
    attributes:
      label: Which documentation needs attention?
      description: Link to or name the file or section.
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: What should be changed?
      description: Explain what is unclear, missing, or incorrect.
    validations:
      required: true
